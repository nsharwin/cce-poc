name: POC Determinism

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-core:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-arm64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.9.27"

      - name: Install Python
        run: uv python install 3.12

      - name: Run unit tests
        run: uv run --python 3.12 pytest -q

      - name: Run PREQ-S-6 determinism gate
        run: uv run --python 3.12 pytest tests/determinism_100x.py -q
