name: Nightly Stability (POC-GATE-3)

on:
  schedule:
    # 06:00 UTC, daily.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  # Re-run the determinism matrix every night. By reusing the same workflow
  # logic as poc-determinism.yml::compare-hashes, a successful run proves
  # cross-runner hash parity for the night.
  matrix-hash:
    name: nightly-${{ matrix.runner-name }}-${{ matrix.fixture }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner-name: [linux-x86_64, linux-arm64]
        fixture: [simple_python, simple_typescript, perf_100k]
        include:
          - runner-name: linux-x86_64
            runner: ubuntu-24.04
          - runner-name: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.9.27"

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Materialise perf_100k fixture
        if: matrix.fixture == 'perf_100k'
        run: |
          mkdir -p tests/fixtures/perf_100k/repo
          uv run python -m tests.fixtures.perf_100k.generate --out tests/fixtures/perf_100k/repo

      - name: Resolve fixture root
        id: fixture-root
        run: |
          if [ "${{ matrix.fixture }}" = "perf_100k" ]; then
            echo "path=tests/fixtures/perf_100k/repo" >> "$GITHUB_OUTPUT"
          else
            echo "path=tests/fixtures/${{ matrix.fixture }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Init fixture git repo (deterministic)
        env:
          GIT_AUTHOR_NAME: CCE Test
          GIT_AUTHOR_EMAIL: cce@example.test
          GIT_AUTHOR_DATE: "2026-01-01T00:00:00+0000"
          GIT_COMMITTER_NAME: CCE Test
          GIT_COMMITTER_EMAIL: cce@example.test
          GIT_COMMITTER_DATE: "2026-01-01T00:00:00+0000"
        run: |
          cd "${{ steps.fixture-root.outputs.path }}"
          git init -q --initial-branch=main
          git config user.email "cce@example.test"
          git config user.name "CCE Test"
          git add .
          git commit -q -m "fixture"

      - name: Score fixture (nightly)
        run: |
          mkdir -p cce-out
          HASH=$(uv run cce score \
            --spec ./scoring-spec.yaml \
            --repo "${{ steps.fixture-root.outputs.path }}" \
            --mode repo \
            --out ./cce-out)
          echo "$HASH" > cce-out/record_hash.txt
          echo "RECORD_HASH=$HASH" >> "$GITHUB_ENV"

      - name: Frozen_Hash_Gate — assert nightly record_hash matches expected_record_hash.txt
        run: |
          set -euo pipefail
          EXPECTED_FILE="tests/fixtures/${{ matrix.fixture }}/expected_record_hash.txt"
          EXPECTED="$(cat "$EXPECTED_FILE")"
          EXPECTED="${EXPECTED%$'\n'}"
          if [ "$RECORD_HASH" != "$EXPECTED" ]; then
            echo "FAIL: nightly ${{ matrix.fixture }} on ${{ matrix.runner-name }}"
            echo "  produced: $RECORD_HASH"
            echo "  expected: $EXPECTED"
            exit 1
          fi
          echo "PASS: nightly ${{ matrix.fixture }} on ${{ matrix.runner-name }} matches frozen hash"

      - name: Upload nightly hash artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-hash-${{ matrix.fixture }}-${{ matrix.runner-name }}
          path: cce-out/record_hash.txt

  # Real Firecracker microVM boot on a self-hosted Linux+KVM runner. Closes
  # the operational hole in PREQ-X-4 (the matrix-hash jobs cover container
  # isolation but never actually boot a VM). The job is intentionally
  # `continue-on-error: true` until the self-hosted runner pool is online —
  # flip it to required once `ops/firecracker/digests.json` is committed.
  firecracker-microvm:
    name: Firecracker microVM end-to-end
    runs-on: [self-hosted, linux, kvm]
    needs: matrix-hash
    continue-on-error: true
    env:
      # Operator must populate these via runner-level repository secrets
      # (sha256 of the matching binaries/images on the runner host).
      CCE_FC_JAILER_BINARY: ${{ secrets.CCE_FC_JAILER_BINARY }}
      CCE_FC_FIRECRACKER_BINARY: ${{ secrets.CCE_FC_FIRECRACKER_BINARY }}
      CCE_FC_KERNEL_IMAGE: ${{ secrets.CCE_FC_KERNEL_IMAGE }}
      CCE_FC_ROOTFS_IMAGE: ${{ secrets.CCE_FC_ROOTFS_IMAGE }}
      CCE_FC_JAILER_DIGEST: ${{ secrets.CCE_FC_JAILER_DIGEST }}
      CCE_FC_FIRECRACKER_DIGEST: ${{ secrets.CCE_FC_FIRECRACKER_DIGEST }}
      CCE_FC_KERNEL_DIGEST: ${{ secrets.CCE_FC_KERNEL_DIGEST }}
      CCE_FC_ROOTFS_DIGEST: ${{ secrets.CCE_FC_ROOTFS_DIGEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.9.27"

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies (with cce-service extras)
        run: uv sync --all-extras

      - name: Init fixture git repo (deterministic)
        env:
          GIT_AUTHOR_NAME: CCE Test
          GIT_AUTHOR_EMAIL: cce@example.test
          GIT_AUTHOR_DATE: "2026-01-01T00:00:00+0000"
          GIT_COMMITTER_NAME: CCE Test
          GIT_COMMITTER_EMAIL: cce@example.test
          GIT_COMMITTER_DATE: "2026-01-01T00:00:00+0000"
        run: |
          cd tests/fixtures/simple_python
          git init -q --initial-branch=main
          git config user.email "cce@example.test"
          git config user.name "CCE Test"
          git add .
          git commit -q -m "fixture"

      - name: Boot one Firecracker microVM and score fixture
        run: |
          mkdir -p fc-out
          CCE_OUT=./fc-out bash ops/firecracker/run-once.sh

      - name: Upload Firecracker hash artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-hash-firecracker
          path: fc-out/record_hash.txt

  streak-tracker:
    name: 7-day green streak
    runs-on: ubuntu-24.04
    needs: [matrix-hash, firecracker-microvm]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download nightly hash artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: hash-artifacts

      - name: Assert per-fixture matrix-hash agreement
        run: |
          set -euo pipefail
          for fixture in simple_python simple_typescript perf_100k; do
            UNIQUE=$(find hash-artifacts \
              -path "*nightly-hash-${fixture}-*/record_hash.txt" \
              -exec cat {} \; | sort -u | wc -l)
            if [ "$UNIQUE" -ne 1 ]; then
              echo "FAIL: nightly fixture=${fixture} produced ${UNIQUE} distinct hashes"
              find hash-artifacts \
                -path "*nightly-hash-${fixture}-*/record_hash.txt" \
                -exec sh -c 'echo "  $1: $(cat $1)"' _ {} \;
              exit 1
            fi
            echo "PASS: nightly fixture=${fixture} agrees across runners"
          done

      - name: Assert nightly hashes agree (legacy single-hash check, retained for firecracker artifact)
        run: |
          set -euo pipefail
          # The matrix-hash job emits per-fixture artifacts; firecracker-microvm
          # emits a single 'nightly-hash-firecracker' artifact. The legacy
          # single-hash check would now spuriously fail because three fixtures
          # naturally produce three distinct hashes. Only the firecracker
          # artifact is compared globally here, against any one fixture's
          # expected hash. The per-fixture cross-runner check above is the
          # binding gate.
          FC_FILE=$(find hash-artifacts -path "*nightly-hash-firecracker/record_hash.txt" | head -n1)
          if [ -z "$FC_FILE" ]; then
            echo "skip: no firecracker artifact yet (job continue-on-error)"
            exit 0
          fi
          FC_HASH="$(cat "$FC_FILE")"
          FC_HASH="${FC_HASH%$'\n'}"
          # Compare to simple_python's expected hash; the firecracker job currently
          # only scores simple_python. Keep this loose until the FC job goes
          # through the fixture matrix.
          EXPECTED="$(cat tests/fixtures/simple_python/expected_record_hash.txt)"
          EXPECTED="${EXPECTED%$'\n'}"
          if [ "$FC_HASH" != "$EXPECTED" ]; then
            echo "WARN: firecracker hash $FC_HASH != simple_python expected $EXPECTED"
            # Do not fail; firecracker job is continue-on-error.
          fi

      - name: Update ops/nightly-streak.json
        env:
          GIT_AUTHOR_NAME: cce-bot
          GIT_AUTHOR_EMAIL: cce-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: cce-bot
          GIT_COMMITTER_EMAIL: cce-bot@users.noreply.github.com
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, datetime, pathlib
          path = pathlib.Path("ops/nightly-streak.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          data = json.loads(path.read_text()) if path.exists() else {
              "streak": 0,
              "required": 7,
              "last_success": None,
              "history": [],
          }
          today = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          if data.get("last_success") == today:
              # idempotent if workflow is re-run on the same UTC day
              raise SystemExit(0)
          data["streak"] = int(data.get("streak", 0)) + 1
          data["last_success"] = today
          history = data.get("history", [])
          history.append(today)
          data["history"] = history[-30:]
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY
          git add ops/nightly-streak.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "ops: nightly stability streak +1"
            git push
          fi

      - name: Assert streak ≥ 7
        run: |
          set -euo pipefail
          STREAK=$(python3 -c "import json; print(json.load(open('ops/nightly-streak.json'))['streak'])")
          echo "Current streak: $STREAK"
          if [ "$STREAK" -lt 7 ]; then
            echo "POC-GATE-3 still pending — need 7 consecutive green nights."
            exit 1
          fi
          echo "POC-GATE-3 satisfied"
