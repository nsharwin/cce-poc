# Alembic configuration for the CCE service Postgres schema.
# The sqlalchemy.url below is a placeholder; the real DSN is supplied
# via the CCE_POSTGRES_DSN env var and injected by migrations/env.py at
# runtime. The placeholder URL prevents accidental dev-credential leakage.
[alembic]
script_location = src/cce_service/migrations
prepend_sys_path = .
version_locations = src/cce_service/migrations/versions
sqlalchemy.url = postgresql+psycopg://SET_VIA_CCE_POSTGRES_DSN:@localhost:5432/cce

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
