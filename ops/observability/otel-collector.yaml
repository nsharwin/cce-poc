# OpenTelemetry Collector sample config for CCE (PREQ-O-1).
#
# Receives OTLP/HTTP traces from cce CLI + cce_service workers, forwards
# them to Tempo/Jaeger, and exposes Prometheus scrape on :9464.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  attributes/cce_safety:
    actions:
      # strip any accidentally-attached source content so traces never
      # leak proprietary code.
      - key: code.snippet
        action: delete

exporters:
  otlphttp/tempo:
    endpoint: ${env:TEMPO_ENDPOINT}
    tls:
      insecure: false
  prometheus:
    endpoint: 0.0.0.0:9464
    namespace: cce
    resource_to_telemetry_conversion:
      enabled: true
  logging:
    loglevel: warn

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/cce_safety, batch]
      exporters: [otlphttp/tempo, logging]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
