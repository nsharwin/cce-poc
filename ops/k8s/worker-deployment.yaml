apiVersion: apps/v1
kind: Deployment
metadata:
  name: cce-worker
  namespace: cce
  labels:
    app: cce-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cce-worker
  template:
    metadata:
      labels:
        app: cce-worker
    spec:
      securityContext:
        readOnlyRootFilesystem: true
      containers:
        - name: worker
          image: cce-service:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "cce_service.workers.runner"]
          envFrom:
            - configMapRef:
                name: cce-config
            - secretRef:
                name: cce-secrets
          env:
            - name: CCE_CLICKHOUSE_HOST
              value: "clickhouse.cce.svc.cluster.local"
          resources:
            limits:
              memory: "4Gi"
              cpu: "4"
            requests:
              memory: "1Gi"
              cpu: "1"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
