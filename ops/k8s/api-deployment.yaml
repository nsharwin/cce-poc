apiVersion: apps/v1
kind: Deployment
metadata:
  name: cce-api
  namespace: cce
  labels:
    app: cce-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cce-api
  template:
    metadata:
      labels:
        app: cce-api
    spec:
      securityContext:
        readOnlyRootFilesystem: true
      containers:
        - name: api
          image: cce-service:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["cce_service.api.app:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cce-config
            - secretRef:
                name: cce-secrets
          env:
            - name: CCE_CLICKHOUSE_HOST
              value: "clickhouse.cce.svc.cluster.local"
          resources:
            limits:
              memory: "2Gi"
              cpu: "2"
            requests:
              memory: "512Mi"
              cpu: "0.5"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
